<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>挥动 菜单</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 250px;
      font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #2b2b2b; color: #f2f2f2; }
      .item:hover { background: rgba(255,255,255,.10) !important; }
      .state { color: #aaa !important; }
      .sep { background: rgba(255,255,255,.14) !important; }
      select { background: #3a3a3a !important; color: #f2f2f2 !important; border-color: #555 !important; }
    }
    .item {
      display: block;
      width: 100%;
      padding: 11px 16px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .item:hover { background: rgba(0,0,0,.07); }
    .item:active { background: rgba(0,0,0,.12); }
    .sep { height: 1px; margin: 4px 8px; background: rgba(0,0,0,.12); }
    .state { padding: 2px 16px 8px; font-size: 11px; color: #777; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 16px;
    }
    .row label { flex: 0 0 auto; }
    select {
      flex: 1 1 auto;
      max-width: 140px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      width: 34px; height: 20px;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #bbb; border-radius: 20px;
      transition: .15s; cursor: pointer;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 14px; height: 14px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .15s;
    }
    .switch input:checked + .slider { background: #6b4fd8; }
    .switch input:checked + .slider::before { transform: translateX(14px); }
  </style>
</head>
<body>
  <div class="row">
    <label>启用手势</label>
    <label class="switch">
      <input type="checkbox" id="gestureEnabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="state" id="state"></div>
  <button class="item" id="settings">打开设置</button>

  <div class="sep"></div>
  <div class="row">
    <label>启用框选链接</label>
    <label class="switch">
      <input type="checkbox" id="lsEnabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <label for="lsModifier">触发键</label>
    <select id="lsModifier">
      <option value="ctrlKey">Ctrl + 左键拖拽</option>
      <option value="altKey">Alt + 左键拖拽</option>
      <option value="shiftKey">Shift + 左键拖拽</option>
    </select>
  </div>
  <div class="row">
    <label for="lsMode">打开方式</label>
    <select id="lsMode">
      <option value="background">后台新标签</option>
      <option value="foreground">前台新标签</option>
      <option value="window">新窗口</option>
      <option value="copy">复制链接</option>
    </select>
  </div>
  <script src="popup.js"></script>
</body>
</html>
